<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hausrat-Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* --- Start Screen --- */
        #start-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 100;
            padding: 2rem;
            text-align: center;
        }

        #start-screen h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        #start-screen p {
            font-size: 0.95rem;
            color: #aab;
            margin-bottom: 2rem;
            max-width: 320px;
            line-height: 1.5;
        }

        #start-btn {
            background: #4361ee;
            color: #fff;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        #start-btn:active {
            background: #3a56d4;
        }

        #start-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #loading-text {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #aab;
            display: none;
        }

        /* --- Camera View --- */
        #camera-view {
            display: none;
            position: relative;
            width: 100%;
            height: 100%;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* --- HUD --- */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        #hud > * {
            pointer-events: auto;
        }

        #status-badge {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        #status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        #counter-badge {
            background: rgba(67, 97, 238, 0.8);
            backdrop-filter: blur(8px);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* --- Bottom Panel --- */
        #bottom-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
            padding: 2rem 1rem 1.5rem;
        }

        #item-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            justify-content: center;
            max-height: 120px;
            overflow-y: auto;
        }

        .item-tag {
            background: rgba(67, 97, 238, 0.7);
            backdrop-filter: blur(4px);
            padding: 0.3rem 0.7rem;
            border-radius: 8px;
            font-size: 0.75rem;
            white-space: nowrap;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        #snapshot-btn {
            display: block;
            margin: 0.8rem auto 0;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background 0.2s;
        }

        #snapshot-btn:active {
            background: rgba(255,255,255,0.3);
        }

        /* --- Snapshot Overlay --- */
        #snapshot-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        #snapshot-overlay.visible {
            display: flex;
        }

        #snapshot-canvas {
            max-width: 95%;
            max-height: 60vh;
            border-radius: 12px;
            border: 2px solid #4361ee;
        }

        #snapshot-items {
            margin-top: 1rem;
            text-align: center;
            max-width: 95%;
        }

        #snapshot-items h3 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        #snapshot-item-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            justify-content: center;
        }

        #close-snapshot {
            margin-top: 1rem;
            background: #4361ee;
            color: #fff;
            border: none;
            padding: 0.7rem 2rem;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
        }

        /* Error */
        #error-msg {
            display: none;
            position: absolute;
            inset: 0;
            background: #1a1a2e;
            z-index: 300;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        #error-msg.visible {
            display: flex;
        }

        #error-msg p {
            color: #f87171;
            margin-top: 1rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <!-- Start Screen -->
    <div id="start-screen">
        <h1>Hausrat-Scanner</h1>
        <p>Scanne deinen Raum mit der Kamera und erkenne automatisch Gegenstaende, die zum Hausrat gehoeren.</p>
        <button id="start-btn">Kamera starten</button>
        <div id="loading-text">Modell wird geladen...</div>
    </div>

    <!-- Camera View -->
    <div id="camera-view">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>

        <div id="hud">
            <div id="status-badge">
                <div id="status-dot"></div>
                <span>Scannen...</span>
            </div>
            <div id="counter-badge">0 Objekte</div>
        </div>

        <div id="bottom-panel">
            <div id="item-list"></div>
            <button id="snapshot-btn" title="Screenshot">&#128247;</button>
        </div>
    </div>

    <!-- Snapshot Overlay -->
    <div id="snapshot-overlay">
        <canvas id="snapshot-canvas"></canvas>
        <div id="snapshot-items">
            <h3>Erkannte Hausrat-Gegenstaende</h3>
            <div id="snapshot-item-list"></div>
        </div>
        <button id="close-snapshot">Zurueck</button>
    </div>

    <!-- Error -->
    <div id="error-msg">
        <h2>Fehler</h2>
        <p id="error-text"></p>
    </div>

    <!-- TensorFlow.js + COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

    <script>
        // ----- Hausrat mapping: COCO label -> German name + category -----
        const HAUSRAT_MAP = {
            // Elektronik
            'tv':            { name: 'Fernseher',        cat: 'Elektronik' },
            'laptop':        { name: 'Laptop',           cat: 'Elektronik' },
            'cell phone':    { name: 'Smartphone',       cat: 'Elektronik' },
            'keyboard':      { name: 'Tastatur',         cat: 'Elektronik' },
            'mouse':         { name: 'Maus',             cat: 'Elektronik' },
            'remote':        { name: 'Fernbedienung',    cat: 'Elektronik' },
            'microwave':     { name: 'Mikrowelle',       cat: 'Elektronik' },
            'oven':          { name: 'Ofen',             cat: 'Elektronik' },
            'toaster':       { name: 'Toaster',          cat: 'Elektronik' },
            'refrigerator':  { name: 'Kuehlschrank',     cat: 'Elektronik' },
            'hair drier':    { name: 'Foehn',            cat: 'Elektronik' },

            // Moebel
            'couch':         { name: 'Sofa',             cat: 'Moebel' },
            'chair':         { name: 'Stuhl',            cat: 'Moebel' },
            'dining table':  { name: 'Esstisch',         cat: 'Moebel' },
            'bed':           { name: 'Bett',             cat: 'Moebel' },
            'potted plant':  { name: 'Zimmerpflanze',    cat: 'Moebel' },

            // Kueche & Haushalt
            'bottle':        { name: 'Flasche',          cat: 'Haushalt' },
            'wine glass':    { name: 'Weinglas',         cat: 'Haushalt' },
            'cup':           { name: 'Tasse',            cat: 'Haushalt' },
            'fork':          { name: 'Gabel',            cat: 'Haushalt' },
            'knife':         { name: 'Messer',           cat: 'Haushalt' },
            'spoon':         { name: 'Loeffel',          cat: 'Haushalt' },
            'bowl':          { name: 'Schuessel',        cat: 'Haushalt' },
            'sink':          { name: 'Spuele',           cat: 'Haushalt' },
            'vase':          { name: 'Vase',             cat: 'Haushalt' },
            'scissors':      { name: 'Schere',           cat: 'Haushalt' },
            'toothbrush':    { name: 'Zahnbuerste',      cat: 'Haushalt' },

            // Textilien
            'umbrella':      { name: 'Regenschirm',      cat: 'Textilien' },
            'handbag':       { name: 'Handtasche',       cat: 'Textilien' },
            'tie':           { name: 'Krawatte',         cat: 'Textilien' },
            'suitcase':      { name: 'Koffer',           cat: 'Textilien' },
            'backpack':      { name: 'Rucksack',         cat: 'Textilien' },

            // Sport & Freizeit
            'sports ball':   { name: 'Ball',             cat: 'Sport' },
            'tennis racket': { name: 'Tennisschlaeger',  cat: 'Sport' },
            'baseball bat':  { name: 'Baseballschlaeger',cat: 'Sport' },
            'baseball glove':{ name: 'Baseballhandschuh',cat: 'Sport' },
            'skateboard':    { name: 'Skateboard',       cat: 'Sport' },
            'surfboard':     { name: 'Surfboard',        cat: 'Sport' },
            'skis':          { name: 'Ski',              cat: 'Sport' },
            'snowboard':     { name: 'Snowboard',        cat: 'Sport' },
            'frisbee':       { name: 'Frisbee',          cat: 'Sport' },
            'kite':          { name: 'Drachen',          cat: 'Sport' },

            // Sonstiges
            'book':          { name: 'Buch',             cat: 'Sonstiges' },
            'clock':         { name: 'Uhr',              cat: 'Sonstiges' },
            'teddy bear':    { name: 'Teddybaer',        cat: 'Sonstiges' },
        };

        const CATEGORY_COLORS = {
            'Elektronik': '#f59e0b',
            'Moebel':     '#8b5cf6',
            'Haushalt':   '#10b981',
            'Textilien':  '#ec4899',
            'Sport':      '#06b6d4',
            'Sonstiges':  '#6366f1',
        };

        // ----- DOM refs -----
        const startScreen  = document.getElementById('start-screen');
        const startBtn     = document.getElementById('start-btn');
        const loadingText  = document.getElementById('loading-text');
        const cameraView   = document.getElementById('camera-view');
        const video        = document.getElementById('video');
        const canvas       = document.getElementById('canvas');
        const ctx          = canvas.getContext('2d');
        const counterBadge = document.getElementById('counter-badge');
        const itemList     = document.getElementById('item-list');
        const snapshotBtn  = document.getElementById('snapshot-btn');
        const snapshotOverlay = document.getElementById('snapshot-overlay');
        const snapshotCanvas  = document.getElementById('snapshot-canvas');
        const snapshotItemList = document.getElementById('snapshot-item-list');
        const closeSnapshot   = document.getElementById('close-snapshot');
        const errorMsg     = document.getElementById('error-msg');
        const errorText    = document.getElementById('error-text');

        let model = null;
        let detecting = false;
        let currentDetections = [];

        // ----- Smoothing State -----
        const LERP_SPEED = 0.25;        // How fast boxes move to new position (0-1)
        const FADE_OUT_MS = 600;         // How long a vanished object stays visible
        const DETECT_INTERVAL = 250;     // ms between detections (not every frame)
        let trackedObjects = {};         // key: class name -> smoothed state
        let lastDetectTime = 0;

        function lerp(a, b, t) { return a + (b - a) * t; }

        function matchAndSmooth(newDetections) {
            const now = Date.now();
            const matched = new Set();

            // Update existing tracked objects or add new ones
            for (const det of newDetections) {
                const key = det.hausrat.name;
                const [x, y, w, h] = det.bbox;

                if (trackedObjects[key]) {
                    // Smoothly interpolate to new position
                    const t = trackedObjects[key];
                    t.targetBbox = [x, y, w, h];
                    t.targetScore = det.score;
                    t.lastSeen = now;
                    t.hausrat = det.hausrat;
                    t.visible = true;
                } else {
                    // New object – start at current position
                    trackedObjects[key] = {
                        smoothBbox: [x, y, w, h],
                        targetBbox: [x, y, w, h],
                        smoothScore: det.score,
                        targetScore: det.score,
                        score: det.score,
                        lastSeen: now,
                        hausrat: det.hausrat,
                        visible: true,
                    };
                }
                matched.add(key);
            }

            // Mark unmatched objects for fade-out
            for (const key in trackedObjects) {
                if (!matched.has(key)) {
                    const age = now - trackedObjects[key].lastSeen;
                    if (age > FADE_OUT_MS) {
                        delete trackedObjects[key];
                    }
                }
            }

            // Interpolate all tracked boxes toward their targets
            for (const key in trackedObjects) {
                const t = trackedObjects[key];
                for (let i = 0; i < 4; i++) {
                    t.smoothBbox[i] = lerp(t.smoothBbox[i], t.targetBbox[i], LERP_SPEED);
                }
            }

            // Build currentDetections from tracked state
            currentDetections = Object.values(trackedObjects).map(t => ({
                bbox: t.smoothBbox,
                score: t.score,
                hausrat: t.hausrat,
                opacity: Math.max(0, 1 - (now - t.lastSeen) / FADE_OUT_MS),
            }));
        }

        // ----- Start -----
        startBtn.addEventListener('click', async () => {
            startBtn.disabled = true;
            loadingText.style.display = 'block';
            loadingText.textContent = 'Kamera wird gestartet...';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
            } catch (e) {
                showError('Kamera-Zugriff verweigert oder nicht verfuegbar. Bitte erlaube den Kamera-Zugriff in den Browser-Einstellungen.');
                return;
            }

            loadingText.textContent = 'KI-Modell wird geladen (ca. 5 MB)...';
            try {
                model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
            } catch (e) {
                showError('Das KI-Modell konnte nicht geladen werden. Bitte pruefe deine Internetverbindung.');
                return;
            }

            startScreen.style.display = 'none';
            cameraView.style.display = 'block';
            resizeCanvas();
            renderLoop();
        });

        // ----- Detection (throttled) -----
        async function runDetection() {
            if (!model || detecting) return;
            detecting = true;
            try {
                const predictions = await model.detect(video, undefined, 0.4);
                const hausratHits = predictions
                    .filter(p => HAUSRAT_MAP[p.class])
                    .map(p => ({ ...p, hausrat: HAUSRAT_MAP[p.class] }));
                matchAndSmooth(hausratHits);
            } catch (e) { /* silently continue */ }
            detecting = false;
        }

        // ----- Render Loop (smooth, every frame) -----
        function renderLoop() {
            const now = Date.now();

            // Run detection at throttled interval
            if (now - lastDetectTime > DETECT_INTERVAL) {
                lastDetectTime = now;
                runDetection();
            }

            // Interpolate boxes + score every frame for smoothness
            for (const key in trackedObjects) {
                const t = trackedObjects[key];
                for (let i = 0; i < 4; i++) {
                    t.smoothBbox[i] = lerp(t.smoothBbox[i], t.targetBbox[i], LERP_SPEED);
                }
                t.smoothScore = lerp(t.smoothScore || t.targetScore, t.targetScore, 0.15);
            }

            // Rebuild currentDetections with updated positions
            const nowForFade = Date.now();
            currentDetections = Object.values(trackedObjects).map(t => ({
                bbox: [...t.smoothBbox],
                score: t.smoothScore,
                hausrat: t.hausrat,
                opacity: Math.max(0, 1 - (nowForFade - t.lastSeen) / FADE_OUT_MS),
            }));

            // Remove fully faded objects
            for (const key in trackedObjects) {
                if (nowForFade - trackedObjects[key].lastSeen > FADE_OUT_MS) {
                    delete trackedObjects[key];
                }
            }

            drawDetections(currentDetections);
            updateUI(currentDetections);
            requestAnimationFrame(renderLoop);
        }

        // ----- Draw Bounding Boxes -----
        function drawDetections(detections) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const scaleX = canvas.width / video.videoWidth;
            const scaleY = canvas.height / video.videoHeight;

            for (const det of detections) {
                const [x, y, w, h] = det.bbox;
                const sx = x * scaleX;
                const sy = y * scaleY;
                const sw = w * scaleX;
                const sh = h * scaleY;
                const alpha = det.opacity !== undefined ? det.opacity : 1;

                const color = CATEGORY_COLORS[det.hausrat.cat] || '#4361ee';
                const confidence = Math.round(det.score * 100);

                ctx.globalAlpha = alpha;

                // Box
                ctx.strokeStyle = color;
                ctx.lineWidth = 2.5;
                ctx.strokeRect(sx, sy, sw, sh);

                // Corner accents
                const corner = Math.min(sw, sh) * 0.15;
                ctx.lineWidth = 4;
                // top-left
                ctx.beginPath(); ctx.moveTo(sx, sy + corner); ctx.lineTo(sx, sy); ctx.lineTo(sx + corner, sy); ctx.stroke();
                // top-right
                ctx.beginPath(); ctx.moveTo(sx + sw - corner, sy); ctx.lineTo(sx + sw, sy); ctx.lineTo(sx + sw, sy + corner); ctx.stroke();
                // bottom-left
                ctx.beginPath(); ctx.moveTo(sx, sy + sh - corner); ctx.lineTo(sx, sy + sh); ctx.lineTo(sx + corner, sy + sh); ctx.stroke();
                // bottom-right
                ctx.beginPath(); ctx.moveTo(sx + sw - corner, sy + sh); ctx.lineTo(sx + sw, sy + sh); ctx.lineTo(sx + sw, sy + sh - corner); ctx.stroke();

                // Label
                const label = `${det.hausrat.name} ${confidence}%`;
                ctx.font = 'bold 13px -apple-system, sans-serif';
                const textW = ctx.measureText(label).width + 12;
                const textH = 22;

                ctx.fillStyle = color;
                const radius = 4;
                const lx = sx;
                const ly = sy - textH;
                ctx.beginPath();
                ctx.moveTo(lx + radius, ly);
                ctx.lineTo(lx + textW - radius, ly);
                ctx.quadraticCurveTo(lx + textW, ly, lx + textW, ly + radius);
                ctx.lineTo(lx + textW, ly + textH);
                ctx.lineTo(lx, ly + textH);
                ctx.lineTo(lx, ly + radius);
                ctx.quadraticCurveTo(lx, ly, lx + radius, ly);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.fillText(label, sx + 6, sy - 6);

                ctx.globalAlpha = 1;
            }
        }

        // ----- Update HUD -----
        function updateUI(detections) {
            // Deduplicate by name
            const unique = {};
            for (const d of detections) {
                const key = d.hausrat.name;
                if (!unique[key] || d.score > unique[key].score) {
                    unique[key] = d;
                }
            }

            const items = Object.values(unique).sort((a, b) => b.score - a.score);
            counterBadge.textContent = `${items.length} Objekt${items.length !== 1 ? 'e' : ''}`;

            itemList.innerHTML = items.map(d => {
                const color = CATEGORY_COLORS[d.hausrat.cat] || '#4361ee';
                return `<span class="item-tag" style="background:${color}cc">${d.hausrat.name}</span>`;
            }).join('');
        }

        // ----- Snapshot -----
        snapshotBtn.addEventListener('click', () => {
            const sCtx = snapshotCanvas.getContext('2d');
            snapshotCanvas.width = video.videoWidth;
            snapshotCanvas.height = video.videoHeight;

            // Draw video frame
            sCtx.drawImage(video, 0, 0);

            // Draw detections on snapshot
            for (const det of currentDetections) {
                const [x, y, w, h] = det.bbox;
                const color = CATEGORY_COLORS[det.hausrat.cat] || '#4361ee';
                const confidence = Math.round(det.score * 100);

                sCtx.strokeStyle = color;
                sCtx.lineWidth = 3;
                sCtx.strokeRect(x, y, w, h);

                const label = `${det.hausrat.name} ${confidence}%`;
                sCtx.font = 'bold 16px sans-serif';
                const tw = sCtx.measureText(label).width + 12;
                sCtx.fillStyle = color;
                sCtx.fillRect(x, y - 24, tw, 24);
                sCtx.fillStyle = '#fff';
                sCtx.fillText(label, x + 6, y - 6);
            }

            // Items list
            const unique = {};
            for (const d of currentDetections) {
                unique[d.hausrat.name] = d;
            }
            snapshotItemList.innerHTML = Object.values(unique).map(d => {
                const color = CATEGORY_COLORS[d.hausrat.cat] || '#4361ee';
                return `<span class="item-tag" style="background:${color}cc">${d.hausrat.name} (${d.hausrat.cat})</span>`;
            }).join('');

            snapshotOverlay.classList.add('visible');
        });

        closeSnapshot.addEventListener('click', () => {
            snapshotOverlay.classList.remove('visible');
        });

        // ----- Resize -----
        function resizeCanvas() {
            canvas.width = video.clientWidth;
            canvas.height = video.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        video.addEventListener('loadedmetadata', resizeCanvas);

        // ----- Error -----
        function showError(msg) {
            errorText.textContent = msg;
            errorMsg.classList.add('visible');
        }
    </script>
</body>
</html>
